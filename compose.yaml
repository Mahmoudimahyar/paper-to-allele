services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kidneymatch
      POSTGRES_USER: kidneymatch
      POSTGRES_PASSWORD: kidneymatch
    ports:
      - "5432:5432"
    volumes:
      - kidneymatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidneymatch -d kidneymatch"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kidneymatch_pg:
