<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLA review</title>
<style>
  :root { --ok:#d7f5dc; --edit:#ffe9b8; --add:#dbe9ff; --pend:#f3f3f3; --bad:#ffd6d6; --line:#ccc; --ink:#222; }
  * { box-sizing:border-box; }
  /* A flex column, NOT `calc(100vh - <guessed header height>)`. The header
     wraps to two or three lines depending on window width, so any hard-coded
     height overflows the viewport and cuts the bottom off the panel — which is
     exactly what it did. */
  html, body { height:100%; }
  body { margin:0; display:flex; flex-direction:column; overflow:hidden;
         font:14px/1.35 system-ui, Segoe UI, Arial, sans-serif; color:var(--ink); background:#fafafa; }
  header { flex:0 0 auto; display:flex; flex-wrap:wrap; gap:.5rem .9rem; align-items:center; padding:.5rem .8rem; background:#fff; border-bottom:1px solid var(--line); }
  header input[type=text] { width:11rem; padding:.25rem .4rem; }
  header .progress { font-variant-numeric:tabular-nums; font-weight:600; }
  header .sep { width:1px; align-self:stretch; background:var(--line); }
  button { cursor:pointer; padding:.25rem .6rem; border:1px solid #b9b9b9; background:#fff;
           border-radius:4px; font:inherit; }
  button:hover { background:#f2f2f2; }
  #bar { flex:0 0 auto; height:3px; background:#e6e6e6; }
  #bar > i { display:block; height:100%; background:#2f7d3c; width:0; transition:width .15s; }
  main { flex:1 1 auto; min-height:0; display:grid; grid-template-columns: minmax(340px, 42%) 1fr;
         gap:.6rem; padding:.6rem; }
  /* min-height:0 on both, or a grid child refuses to shrink below its content
     and pushes the page taller than the window. */
  #viewer { position:relative; min-height:0; overflow:auto; border:1px solid var(--line); background:#2b2b2b; border-radius:4px; }
  #panel { min-height:0; }
  @media (max-width: 980px) {
    main { grid-template-columns:1fr; grid-template-rows:minmax(160px, 38%) 1fr; }
  }
  #stage { position:relative; display:inline-block; }
  #stage img { display:block; }
  .hl { position:absolute; border:2px solid #ff3b3b; box-shadow:0 0 0 2px rgba(255,255,255,.7); pointer-events:none; display:none; }
  .hl.anchor { border-color:#2d7cff; }
  #panel { overflow:auto; min-height:0; }
  .doc { background:#fff; border:1px solid var(--line); border-radius:4px; padding:.7rem .8rem; margin-bottom:.6rem; }
  .tags span { display:inline-block; background:#eee; border-radius:3px; padding:0 .4rem; margin:.1rem .2rem .1rem 0; font-size:12px; }
  .tags span.primary { background:#ffd27a; }
  table { width:100%; border-collapse:collapse; }
  th, td { border-bottom:1px solid #e8e8e8; padding:.45rem .5rem; vertical-align:middle; text-align:left; }
  th { font-size:12px; color:#555; font-weight:600; }
  tr.cell { background:var(--pend); }
  tr.cell:hover { filter:brightness(.985); }
  tr.cell.APPROVED { background:var(--ok); }
  tr.cell.EDITED { background:var(--edit); }
  tr.cell.ADDED { background:var(--add); }
  tr.cell.NONE { background:#fff; }
  tr.cell.current td:first-child { box-shadow: inset 4px 0 #2d7cff; }
  td.locus { font-weight:700; width:4.2rem; font-size:15px; letter-spacing:.2px; }
  /* The crop IS the evidence. It gets the room. */
  td.ev { min-width:0; }
  td.ev .crop { margin-bottom:.3rem; }
  td.ev .sugg { min-width:0; }
  /* Tall enough to read, capped so a wide two-allele crop cannot push the
     answer control off the panel — which is exactly what `max-width:none` did. */
  td.ev .crop img { display:block; max-height:56px; max-width:100%; width:auto; cursor:zoom-in;
                background:#fff; border:1px solid #d8d8d8; border-radius:3px; padding:2px; }
  td.ev .crop img.big { max-height:200px; max-width:620px; cursor:zoom-out; }
  td.ev .crop .nobox { color:#999; font-size:12px; font-style:italic; }
  .sugg { font-family:ui-monospace, Consolas, monospace; font-size:12.5px; line-height:1.5; }
  .rd { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rd .eng { color:#7a7a7a; display:inline-block; width:5.6rem; font-family:system-ui, sans-serif;
             font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  .rd .v { color:#111; font-weight:600; }
  .rd-pipe .v { font-size:14px; }
  .rd-agree { color:#2f7d3c; }
  .rd-agree .v { color:#2f7d3c; font-weight:500; font-family:system-ui, sans-serif; }
  .rd-differ .v { color:#b00020; }
  .rd-differ .verdict { color:#b00020; font-weight:700; margin-left:.5rem; font-size:11px; }
  .rd-dim .v { color:#777; font-weight:400; }
  .rd .flag { color:#8a6d00; background:#fff4d6; border-radius:3px; padding:0 .35rem; margin-left:.5rem;
              font-family:system-ui, sans-serif; font-size:11px; }
  .rd .why { color:#8a5300; font-family:system-ui, sans-serif; white-space:normal; }
  .rd .votes { color:#777; margin-left:.4rem; }
  .sugg.hidden > div { visibility:hidden; }
  /* A fixed, narrow answer column, stacked. Laid out in a row it took 456px of
     a 707px panel and pushed the confirm button out of sight. */
  td.edit { width:196px; vertical-align:top; padding-top:.55rem; }
  td.edit .answer { display:flex; flex-direction:column; gap:.32rem; }
  td.edit .answer-row { display:flex; align-items:center; justify-content:space-between; gap:.4rem; }
  td.edit input[type=text] { width:100%; font-family:ui-monospace, Consolas, monospace;
                             font-size:15px; padding:.28rem .4rem; border:1px solid #b9b9b9; border-radius:3px; }
  td.edit input[type=text]:focus { outline:2px solid #2d7cff; outline-offset:0; border-color:#2d7cff; }
  td.edit select { width:100%; padding:.26rem; }
  td.edit label { white-space:nowrap; font-size:12px; color:#555; }
  td.edit button[data-confirm] { padding:.28rem .7rem; font-weight:600; }
  tr.cell.APPROVED td.edit button[data-confirm],
  tr.cell.EDITED td.edit button[data-confirm],
  tr.cell.ADDED td.edit button[data-confirm] { background:#fff; border:1px solid #9c9c9c; }
  .doclevel { display:flex; flex-wrap:wrap; gap:.6rem 1.2rem; margin:.4rem 0 .6rem; align-items:center; }
  .doclevel .pipe { color:#666; font-size:12px; }
  .help { font-size:12px; color:#555; }
  kbd { background:#eee; border:1px solid #ccc; border-radius:3px; padding:0 .3rem; font-size:11px; }
  #jump { max-width:14rem; }
  .warn { color:#b00020; }
  .warnbar { background:#ffd6d6; border-bottom:1px solid #b00020; color:#7a0016; padding:.5rem .8rem; font-weight:600; }
</style>
</head>
<body>
<header>
  <label>Annotator <input id="annotator" type="text" placeholder="your name"></label>
  <span class="progress" id="progress"></span>
  <button id="prev">◀ prev</button>
  <button id="next">next ▶</button>
  <select id="jump"></select>
  <label><input type="checkbox" id="hideSugg"> hide suggestions until I type</label>
  <button id="export">Export labels</button>
  <label><button type="button" onclick="document.getElementById('import').click()">Import labels</button><input id="import" type="file" accept="application/json" hidden></label>
  <span class="help"><kbd>Enter</kbd> approve/confirm &amp; next · <kbd>Alt+↓</kbd>/<kbd>Alt+↑</kbd> next/prev doc · click a row to highlight it on the image · zoom: <button id="zoomOut">−</button><button id="zoomFit">fit page</button><button id="zoomIn">+</button> <label><input type="checkbox" id="autoZoom" checked> zoom to the row</label></span>
</header>
<div id="bar"><i></i></div>
<main>
  <div id="viewer"><div id="stage"><img id="page" alt="report"><div class="hl" id="hlValue"></div><div class="hl anchor" id="hlAnchor"></div></div></div>
  <div id="panel"></div>
</main>
<script src="pack.js"></script>
<script>
(function () {
  'use strict';
  const PACK = window.PACK;
  if (!PACK) { document.getElementById('panel').innerHTML = '<p class="warn">pack.js not found next to this page. Run scripts/review_pack.py and open the index.html it writes.</p>'; return; }

  // ---- state -------------------------------------------------------------
  const ALLELE = /^(?:[A-Z]{1,4}[0-9]?\*)?\*?(\d{2,4}(?::\d{2,4})?)([NLSQCA])?$/i;
  const STATES_HLA = ['VALUE', 'NOT_PRINTED', 'BLANK', 'UNREADABLE'];
  const STATES_DRBX = ['PRESENT_ONLY', 'ABSENT', 'VALUE', 'NOT_PRINTED', 'BLANK', 'UNREADABLE'];
  let docIndex = 0;
  let zoom = null;          // null = fit the pane's width
  let autoZoom = true;      // selecting a row zooms in far enough to read it
  const TARGET_ROW_PX = 34; // how tall a value row should be on screen
  const MAX_ZOOM = 4;
  const key = () => 'hla_review:' + PACK.pack_id + ':' + (document.getElementById('annotator').value.trim() || 'anon');

  // Whether this browser will actually keep anything. Opened straight off the
  // disk, or in a private window, localStorage can be unavailable — and a
  // labelling tool that silently forgets two hours of work is worse than one
  // that refuses to start, so this is probed once and said out loud.
  //
  // This MUST be initialised before the first `load()`. `function load()` is
  // hoisted but `let storageWorks` is not, so calling load() above this line
  // throws a temporal-dead-zone ReferenceError that kills the whole script and
  // renders an empty page. That shipped once; `test_review_page_renders` now
  // opens the page in a real browser so it cannot ship again.
  let storageWorks = (function () {
    try {
      localStorage.setItem('hla_review:probe', '1');
      localStorage.removeItem('hla_review:probe');
      return true;
    } catch (e) { return false; }
  })();

  // Deliberately NOT `let labels = load()` here. `load()` is hoisted but the
  // `let`s it reads are not, so calling anything at the top of this scope
  // risks a temporal-dead-zone ReferenceError that kills the script and
  // renders a blank page. That shipped once. Nothing in this scope now runs
  // until `start()` at the very bottom, after every declaration exists.
  let labels = { cells: {}, documents: {} };

  function load() {
    if (!storageWorks) return {};
    try { return JSON.parse(localStorage.getItem(key()) || '{}'); } catch (e) { return {}; }
  }
  function save() {
    if (storageWorks) {
      try { localStorage.setItem(key(), JSON.stringify(labels)); }
      catch (e) { storageWorks = false; warnAboutStorage(); }
    }
    renderProgress();
  }
  function warnAboutStorage() {
    if (document.getElementById('storageWarning')) return;
    const bar = document.createElement('div');
    bar.id = 'storageWarning';
    bar.className = 'warnbar';
    bar.textContent = 'This browser will not save your progress here, so nothing is being kept between reloads. '
      + 'Serve the folder instead — run  python -m http.server 8765  inside it and open http://localhost:8765 — '
      + 'or export your labels before you close the tab.';
    document.body.insertBefore(bar, document.querySelector('main'));
  }

  // ---- helpers -----------------------------------------------------------
  function bodies(value) {
    // "DRB1*11 DRB1*15" -> ["11", "15"]; locus prefix is provenance, not the reading.
    if (!value) return [];
    return value.split(/\s+/).filter(Boolean).map(p => p.split('*').pop());
  }
  function normaliseInput(text) {
    const out = [];
    for (const tok of (text || '').trim().split(/[\s,;/]+/).filter(Boolean)) {
      const m = ALLELE.exec(tok);
      if (!m) return null;
      out.push(m[1] + (m[2] ? m[2].toUpperCase() : ''));
    }
    return out;
  }
  function sameSet(a, b) {
    const x = [...a].sort().join(' '), y = [...b].sort().join(' ');
    return x === y;
  }
  function decision(cell, state, alleles) {
    const pipe = bodies(cell.value);
    const pipeState = cell.status === 'RESOLVED' ? (cell.kind === 'DRBX' ? (cell.value === 'ABSENT' ? 'ABSENT' : 'PRESENT_ONLY') : 'VALUE') : null;
    if (state === 'VALUE' || state === 'PRESENT_ONLY' || state === 'ABSENT') {
      if (pipeState === null) return 'ADDED';
      if (cell.kind === 'DRBX') return (state === pipeState && (state !== 'VALUE' || sameSet(alleles, pipe))) ? 'APPROVED' : 'EDITED';
      return sameSet(alleles, pipe) ? 'APPROVED' : 'EDITED';
    }
    return pipeState === null ? 'APPROVED' : 'EDITED'; // human says no value; pipeline agreed (abstained) or not
  }
  function defaultStateFor(cell) {
    // The pipeline already says WHY it read nothing, and the reason maps onto
    // the label states. Pre-selecting it turns ~850 of the 1,650 cells in a
    // 150-document pack into a single Enter instead of a dropdown each.
    if (cell.status === 'RESOLVED') {
      if (cell.kind !== 'DRBX') return 'VALUE';
      return cell.value === 'ABSENT' ? 'ABSENT' : 'PRESENT_ONLY';
    }
    // The form prints this row and the laboratory never fills it (HA-009).
    // That is BLANK, not "type a value here": asking a reviewer to invent one
    // is the opposite of what NOT_TESTED means.
    if (cell.status === 'NOT_TESTED') return 'BLANK';
    const why = (cell.suggestions && cell.suggestions.pipeline && cell.suggestions.pipeline.reason) || '';
    if (/no anchor on this document|no grouped DRB3\/4\/5 header/.test(why)) return 'NOT_PRINTED';
    if (/no box at all/.test(why)) return 'BLANK';       // label printed, cell empty
    return 'VALUE';                                       // boxes are there: read them
  }

  function fmtVotes(votes) {
    // {"0:11": 7, "0:17": 2, "1:15": 9} -> "pos0: 11×7 17×2 | pos1: 15×9"
    const by = {};
    for (const k in votes) { const [pos, txt] = k.split(/:(.*)/); (by[pos] = by[pos] || []).push((txt || '∅') + '×' + votes[k]); }
    return Object.keys(by).sort().map(p => by[p].join(' ')).join(' | ');
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---- rendering ---------------------------------------------------------
  const panel = document.getElementById('panel');
  const page = document.getElementById('page');
  const stage = document.getElementById('stage');
  const viewer = document.getElementById('viewer');

  function renderProgress() {
    const total = PACK.n_cells;
    const known = new Set();
    for (const d of PACK.documents) for (const c of d.cells) known.add(c.cell_id);
    const done = Object.keys(labels.cells).filter(id => known.has(id)).length;
    const docsDone = PACK.documents.filter(d => d.cells.length && d.cells.every(c => labels.cells[c.cell_id])).length;
    document.getElementById('progress').textContent = PACK.documents.length
      ? `doc ${docIndex + 1}/${PACK.n_documents} · ${docsDone} done · ${done}/${total} cells`
      : 'this pack contains no documents';
    const bar = document.querySelector('#bar > i');
    if (bar) bar.style.width = (100 * done / Math.max(total, 1)).toFixed(1) + '%';
    const jump = document.getElementById('jump');
    if (jump.options.length !== PACK.documents.length) {
      jump.innerHTML = PACK.documents.map((d, i) => `<option value="${i}">${i + 1}. ${esc(d.primary_tag)} ${esc(d.family || '')}</option>`).join('');
    }
    jump.value = String(docIndex);
    for (const [i, d] of PACK.documents.entries()) {
      const complete = d.cells.length && d.cells.every(c => labels.cells[c.cell_id]);
      jump.options[i].textContent = `${complete ? '✓' : '·'} ${i + 1}. ${d.primary_tag} ${d.family || ''}`;
    }
  }

  function layoutImage() {
    const doc = PACK.documents[docIndex];
    const w = zoom ? doc.width * zoom : viewer.clientWidth - 2;
    stage.style.width = w + 'px';
    page.style.width = w + 'px';
    page.style.height = (w * doc.height / doc.width) + 'px';
  }
  function highlight(cell) {
    const hv = document.getElementById('hlValue'), ha = document.getElementById('hlAnchor');
    const place = (el, box) => {
      if (!box) { el.style.display = 'none'; return; }
      el.style.display = 'block';
      el.style.left = (box[0] * 100) + '%'; el.style.top = (box[1] * 100) + '%';
      el.style.width = ((box[2] - box[0]) * 100) + '%'; el.style.height = ((box[3] - box[1]) * 100) + '%';
    };
    if (!cell) { place(hv, null); place(ha, null); return; }
    const vb = cell.value_boxes && cell.value_boxes.length ? [
      Math.min(...cell.value_boxes.map(b => b[0])), Math.min(...cell.value_boxes.map(b => b[1])),
      Math.max(...cell.value_boxes.map(b => b[2])), Math.max(...cell.value_boxes.map(b => b[3]))] : null;
    place(hv, vb); place(ha, cell.anchor_box);
    const box = vb || cell.anchor_box;
    if (!box) return;

    // Fit-width on a portrait report in a narrow pane renders the print at
    // about 45% — too small to check a digit against, which is the entire task.
    // Selecting a row zooms until the ROW is a readable height and centres it.
    // The reader keeps the overview via the `fit` button.
    const doc = PACK.documents[docIndex];
    const rowFraction = Math.max(box[3] - box[1], 0.004);
    const wanted = Math.min(MAX_ZOOM, (TARGET_ROW_PX / rowFraction) / doc.height);
    if (autoZoom && wanted > (zoom || page.clientWidth / doc.width)) {
      zoom = wanted;
      layoutImage();
    }
    const cx = ((box[0] + box[2]) / 2) * page.clientWidth;
    const cy = ((box[1] + box[3]) / 2) * page.clientHeight;
    viewer.scrollTo({
      top: Math.max(0, cy - viewer.clientHeight / 2),
      left: Math.max(0, cx - viewer.clientWidth / 2),
      behavior: 'smooth',
    });
  }

  const READER_ORDER = ['tesseract5', 'ppocrv5', 'decode'];

  function readersFor(cell) {
    const s = cell.suggestions || {};
    const out = [];
    for (const name of READER_ORDER) {
      if (s[name]) out.push({ name, reading: s[name].reading, verdict: s[name].verdict, votes: s[name].votes });
    }
    // Any confirmer the pack carries that this list does not name, plus the
    // separate per-engine suggestion files. Iterating the object rather than a
    // hard-coded list is what keeps a renamed engine from silently vanishing —
    // `tesseract` became `tesseract5` once and took both confirmers with it.
    for (const name of Object.keys(s)) {
      if (name === 'pipeline' || READER_ORDER.includes(name)) continue;
      out.push({ name, reading: s[name].reading, verdict: s[name].verdict, votes: s[name].votes });
    }
    for (const eng of PACK.engines || []) {
      const txt = (PACK.suggestions[eng] || {})[cell.cell_id];
      if (txt !== undefined) out.push({ name: eng, reading: txt, verdict: null });
    }
    return out;
  }

  function suggestionHtml(cell) {
    const p = (cell.suggestions || {}).pipeline || {};
    const readers = readersFor(cell);
    const pipeKey = bodies(cell.value).sort().join(' ');
    const rows = [];

    // The pipeline's own line always shows: it is the value being judged.
    const flags = [];
    if (p.repaired) flags.push('glyph repaired');
    if (p.second_allele === 'UNREAD') flags.push('2nd allele UNREAD');
    if (p.stability && p.stability !== 'NOT_CHECKED' && p.stability !== 'UNANIMOUS') flags.push(p.stability);
    rows.push(
      `<div class="rd rd-pipe"><span class="eng">pipeline</span>` +
      `<span class="v">${esc(p.value || '—')}</span>` +
      (flags.length ? `<span class="flag">${esc(flags.join(' · '))}</span>` : '') +
      `</div>`);
    if (p.raw && p.raw !== p.value) {
      rows.push(`<div class="rd rd-dim"><span class="eng">raw OCR</span><span class="v">${esc(p.raw)}</span></div>`);
    }
    if (p.status !== 'RESOLVED' && p.reason) {
      rows.push(`<div class="rd rd-why"><span class="eng">refused</span><span class="why">${esc(p.reason)}</span></div>`);
    }

    // Readers that agree with the pipeline are collapsed into one line: five
    // identical rows per cell is noise, and noise is what hides the sixth row
    // that does not match.
    const agree = [], differ = [];
    for (const r of readers) {
      const said = bodies(r.reading).sort().join(' ');
      const same = r.verdict ? r.verdict === 'CONFIRMED' || r.verdict === 'UNANIMOUS'
                             : (said && said === pipeKey);
      (same ? agree : differ).push(r);
    }
    if (agree.length) {
      rows.push(`<div class="rd rd-agree" title="${esc(agree.map(r => r.name).join(', '))}">` +
        `<span class="eng">agree</span><span class="v">${agree.length} reader${agree.length > 1 ? 's' : ''}: ` +
        `${esc(agree.map(r => r.name).join(', '))}</span></div>`);
    }
    for (const r of differ) {
      const label = r.verdict || 'reads';
      const votes = r.verdict === 'SPLIT' && r.votes ? ` <span class="votes">${esc(fmtVotes(r.votes))}</span>` : '';
      rows.push(`<div class="rd rd-differ"><span class="eng">${esc(r.name)}</span>` +
        `<span class="v">${esc(r.reading || '—')}</span>` +
        `<span class="verdict ${esc(label)}">${esc(label)}</span>${votes}</div>`);
    }
    return rows.join('');
  }

  function renderDoc() {
    const doc = PACK.documents[docIndex];
    if (!doc) {
      // An empty or exhausted pack is an operator mistake, not a stack trace.
      panel.innerHTML = '<div class="doc"><p class="warn">This pack contains no documents. '
        + 'Rebuild it with <code>scripts/review_pack.py</code>.</p></div>';
      page.removeAttribute('src');
      renderProgress();
      return;
    }
    page.src = doc.image;
    zoom = null; layoutImage(); highlight(null);
    const dl = labels.documents[doc.id] || {};
    const hide = document.getElementById('hideSugg').checked;
    const roleOpts = ['', 'DONOR', 'RECIPIENT', 'BOTH', 'UNKNOWN'];
    const aboOpts = ['', 'A', 'B', 'AB', 'O', 'NOT_PRINTED', 'UNREADABLE'];
    const rhOpts = ['', 'POSITIVE', 'NEGATIVE', 'NOT_PRINTED', 'UNREADABLE'];
    const sel = (id, opts, val) => `<select data-doc="${id}">${opts.map(o => `<option value="${o}" ${o === (val || '') ? 'selected' : ''}>${o || '—'}</option>`).join('')}</select>`;
    let html = `<div class="doc">
      <div class="tags">${doc.tags.map(t => `<span class="${t === doc.primary_tag ? 'primary' : ''}">${esc(t)}</span>`).join('')}
        <span>${esc(doc.quality_band || '?')}</span><span>${esc(doc.family || 'no family')}</span>${doc.comparison_sheet ? '<span>comparison sheet</span>' : ''}${doc.consistency && doc.consistency !== 'CONSISTENT' && doc.consistency !== 'NOT_CHECKABLE' ? `<span class="warn">${esc(doc.consistency)}</span>` : ''}</div>
      <div class="doclevel">
        <label>Role ${sel('role', roleOpts, dl.role)} <span class="pipe">pipeline: ${esc(doc.role.value || doc.role.status || '—')}${doc.role.source && doc.role.source !== 'NONE' ? ' (' + esc(doc.role.source) + ')' : ''}</span></label>
        <label>ABO ${sel('abo', aboOpts, dl.abo)} <span class="pipe">pipeline: ${esc(doc.abo.value || doc.abo.status || '—')}</span></label>
        <label>Rh ${sel('rh', rhOpts, dl.rh)} <span class="pipe">pipeline: ${esc(doc.rh.value || '—')}</span></label>
        <label><input type="checkbox" data-doc="not_a_report" ${dl.not_a_report ? 'checked' : ''}> not a lab report</label>
        <label><input type="checkbox" data-doc="unsure" ${dl.unsure ? 'checked' : ''}> unsure about this document</label>
      </div>
      <table><thead><tr><th>locus</th><th>what the page shows, and what each reader made of it</th><th>your reading</th></tr></thead><tbody>`;
    for (const cell of doc.cells) {
      const lab = labels.cells[cell.cell_id];
      const states = cell.kind === 'DRBX' ? STATES_DRBX : STATES_HLA;
      const defaultState = defaultStateFor(cell);
      const state = lab ? lab.state : defaultState;
      const text = lab ? lab.alleles.join(' ') : (cell.kind === 'DRBX' ? '' : bodies(cell.value).join(' '));
      // Evidence (crop above the readings) in ONE column, the answer in the
      // next. Four side-by-side columns needed 1,210px in a 707px panel, which
      // put the input the reviewer is meant to use off the right-hand edge.
      html += `<tr class="cell ${lab ? lab.decision : ''}" data-cell="${cell.cell_id}">
        <td class="locus">${esc(cell.locus)}</td>
        <td class="ev">
          <div class="crop">${cell.crop ? `<img src="${cell.crop}" alt="crop of the ${esc(cell.locus)} cell">` : '<span class="nobox">no box on this row</span>'}</div>
          <div class="sugg ${hide && !lab ? 'hidden' : ''}">${suggestionHtml(cell)}</div>
        </td>
        <td class="edit"><div class="answer">
          <select data-state aria-label="reading state for ${esc(cell.locus)}">${states.map(s => `<option value="${s}" ${s === state ? 'selected' : ''}>${s}</option>`).join('')}</select>
          <input type="text" data-alleles value="${esc(text)}" placeholder="11 15" aria-label="alleles for ${esc(cell.locus)}" ${state === 'VALUE' ? '' : 'disabled'}>
          <div class="answer-row">
            <label><input type="checkbox" data-unsure ${lab && lab.unsure ? 'checked' : ''}> unsure</label>
            <button data-confirm>${lab ? '✓ done' : 'confirm'}</button>
          </div>
        </div></td></tr>`;
    }
    html += '</tbody></table></div>';
    panel.innerHTML = html;
    renderProgress();
    const first = panel.querySelector('tr.cell:not(.APPROVED):not(.EDITED):not(.ADDED) input[data-alleles]') || panel.querySelector('input[data-alleles]');
    if (first) { setCurrent(first.closest('tr')); first.focus(); first.select(); }
  }

  function setCurrent(tr) {
    for (const r of panel.querySelectorAll('tr.cell')) r.classList.toggle('current', r === tr);
    const doc = PACK.documents[docIndex];
    highlight(doc.cells.find(c => c.cell_id === tr.dataset.cell));
  }

  function confirmRow(tr) {
    const doc = PACK.documents[docIndex];
    const cell = doc.cells.find(c => c.cell_id === tr.dataset.cell);
    const state = tr.querySelector('[data-state]').value;
    const input = tr.querySelector('[data-alleles]');
    let alleles = [];
    if (state === 'VALUE') {
      alleles = normaliseInput(input.value);
      if (alleles === null || alleles.length === 0 || alleles.length > 2) {
        input.style.outline = '2px solid #b00020'; input.focus();
        return false;
      }
    }
    input.style.outline = '';
    const dec = decision(cell, state, alleles);
    labels.cells[cell.cell_id] = {
      locus: cell.locus, state, alleles,
      resolution: state === 'VALUE' ? (alleles.some(a => a.includes(':')) ? 'TWO_FIELD' : 'FIRST_FIELD') : null,
      unsure: tr.querySelector('[data-unsure]').checked,
      decision: dec, pipeline_value: cell.value, pipeline_status: cell.status,
      labelled_utc: new Date().toISOString(),
    };
    tr.className = 'cell ' + dec + ' current';
    tr.querySelector('[data-confirm]').textContent = '✓ done';
    tr.querySelector('.sugg').classList.remove('hidden');
    save();
    return true;
  }

  function focusNextRow(tr) {
    let next = tr.nextElementSibling;
    while (next && (next.classList.contains('APPROVED') || next.classList.contains('EDITED') || next.classList.contains('ADDED'))) next = next.nextElementSibling;
    if (next) { setCurrent(next); const i = next.querySelector('[data-alleles]'); if (i && !i.disabled) { i.focus(); i.select(); } else next.querySelector('[data-state]').focus(); }
    else if (docIndex + 1 < PACK.documents.length) { docIndex++; renderDoc(); }
  }

  // ---- events ------------------------------------------------------------
  panel.addEventListener('click', e => {
    const tr = e.target.closest('tr.cell');
    if (tr) setCurrent(tr);
    if (e.target.matches('[data-confirm]')) { if (confirmRow(tr)) focusNextRow(tr); }
    if (e.target.matches('.crop img')) e.target.classList.toggle('big');
  });
  panel.addEventListener('focusin', e => { const tr = e.target.closest('tr.cell'); if (tr) setCurrent(tr); });
  panel.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.closest('tr.cell')) { e.preventDefault(); const tr = e.target.closest('tr.cell'); if (confirmRow(tr)) focusNextRow(tr); }
  });
  panel.addEventListener('change', e => {
    const doc = PACK.documents[docIndex];
    if (e.target.matches('[data-state]')) {
      const tr = e.target.closest('tr.cell'); const input = tr.querySelector('[data-alleles]');
      input.disabled = e.target.value !== 'VALUE';
      if (!input.disabled) input.focus();
    }
    if (e.target.matches('[data-doc]')) {
      const d = labels.documents[doc.id] = labels.documents[doc.id] || {};
      d[e.target.dataset.doc] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
      if (e.target.dataset.doc === 'not_a_report' && e.target.checked) {
        for (const cell of doc.cells) labels.cells[cell.cell_id] = { locus: cell.locus, state: 'NOT_A_REPORT', alleles: [], resolution: null, unsure: false, decision: cell.status === 'RESOLVED' ? 'EDITED' : 'APPROVED', pipeline_value: cell.value, pipeline_status: cell.status, labelled_utc: new Date().toISOString() };
        save(); renderDoc(); return;
      }
      save();
    }
  });
  panel.addEventListener('input', e => {
    if (e.target.matches('[data-alleles]')) e.target.closest('tr').querySelector('.sugg').classList.remove('hidden');
  });
  document.getElementById('prev').onclick = () => { if (docIndex > 0) { docIndex--; renderDoc(); } };
  document.getElementById('next').onclick = () => { if (docIndex + 1 < PACK.documents.length) { docIndex++; renderDoc(); } };
  document.getElementById('jump').onchange = e => { docIndex = Number(e.target.value); renderDoc(); };
  document.getElementById('hideSugg').onchange = renderDoc;
  let annotatorWas = '';
  document.getElementById('annotator').onchange = () => {
    // Labels are stored per annotator. Someone who labels a few rows before
    // typing their name would otherwise watch the work vanish into the `anon`
    // bucket, so unnamed work is carried across.
    //
    // ONLY from the unnamed bucket. The golden protocol needs two INDEPENDENT
    // labellers, and they will often share a machine; carrying one named
    // person's answers into the next person's session would silently destroy
    // the independence the whole comparison rests on.
    const carried = labels;
    const cameFromAnon = annotatorWas === '';
    annotatorWas = document.getElementById('annotator').value.trim();
    labels = load();
    labels.cells = labels.cells || {};
    labels.documents = labels.documents || {};
    const hadWork = carried && Object.keys(carried.cells || {}).length;
    if (cameFromAnon && hadWork && !Object.keys(labels.cells).length) {
      labels.cells = Object.assign({}, carried.cells);
      labels.documents = Object.assign({}, carried.documents || {});
      save();
    }
    renderDoc();
  };
  document.getElementById('zoomIn').onclick = () => { zoom = (zoom || page.clientWidth / PACK.documents[docIndex].width) * 1.4; layoutImage(); };
  document.getElementById('zoomOut').onclick = () => { zoom = (zoom || page.clientWidth / PACK.documents[docIndex].width) / 1.4; layoutImage(); };
  document.getElementById('zoomFit').onclick = () => { zoom = null; layoutImage(); };
  document.getElementById('autoZoom').onchange = e => { autoZoom = e.target.checked; };
  window.addEventListener('resize', layoutImage);
  document.addEventListener('keydown', e => {
    if (e.altKey && e.key === 'ArrowDown') { e.preventDefault(); document.getElementById('next').click(); }
    if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); document.getElementById('prev').click(); }
  });

  window.addEventListener('beforeunload', event => {
    if (!storageWorks && Object.keys(labels.cells).length) { event.preventDefault(); event.returnValue = ''; }
  });

  document.getElementById('export').onclick = () => {
    const name = document.getElementById('annotator').value.trim() || 'anon';
    const payload = {
      schema: 'golden-labels/v1', tool: 'hla_review.html', pack: PACK.pack_id, annotator: name,
      exported_utc: new Date().toISOString(), anchored: true,
      n_cells: Object.keys(labels.cells).length,
      documents: labels.documents, cells: labels.cells,
    };
    const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `hla_review_${name}_${PACK.pack_id}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  document.getElementById('import').onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    file.text().then(text => {
      const payload = JSON.parse(text);
      if (payload.pack !== PACK.pack_id && !confirm('This file was exported from a different pack. Import anyway?')) return;
      labels.cells = Object.assign(labels.cells, payload.cells || {});
      labels.documents = Object.assign(labels.documents, payload.documents || {});
      if (payload.annotator) document.getElementById('annotator').value = payload.annotator;
      save(); renderDoc();
    });
  };

  function start() {
    labels = load();
    labels.cells = labels.cells || {};
    labels.documents = labels.documents || {};
    renderDoc();
    if (!storageWorks) warnAboutStorage();
  }

  start();
})();
</script>
</body>
</html>
