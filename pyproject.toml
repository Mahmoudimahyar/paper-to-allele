[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kidneymatch-iran"
version = "0.0.1"
description = "Evidence-first kidney donor/recipient ingestion and matching platform for Iran"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
hist = [
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "polars>=1,<2",
  "rapidfuzz>=3,<4",
]
image = [
  "Pillow>=11,<13",
  "opencv-python-headless>=4.10,<5",
  "ImageHash>=4.3,<5",
]
hla = [
  "py-ard>=1,<2",
]
web = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "django-allauth>=65,<66",
]
ocr = [
    "numpy>=2,<3",
    "onnxtr[cpu]>=0.9,<1",
    "pillow>=11,<13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kidneymatch"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["kidneymatch"]

[dependency-groups]
# Installed by default by `uv sync` / `uv run`. Kept as a PEP 735 group rather
# than a `dev` extra so a fresh clone gets exactly what CI and the dev machine
# get, with no --extra flag to forget.
dev = [
  "bandit[toml]>=1.8,<2",
  "hypothesis>=6,<7",
  "mutmut>=3.7,<4",
  "mypy>=1.17,<2",
  "pytest-cov>=6,<8",
  "pytest-django>=4.11,<5",
  "pytest-randomly>=3.16,<4",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.coverage.run]
source = ["src/kidneymatch"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
# Ratchet. Raise it as coverage rises; never lower it to make a build pass.
fail_under = 65
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
# B101 (assert_used) is noise in a project that never ships with -O.
skips = ["B101"]

[tool.mutmut]
# Scoped to the code where a surviving mutant is a clinical safety risk, not to
# the whole tree: mutation testing the scaffolding would cost hours and prove
# nothing. Widen `only_mutate` as matching/OCR come online.
source_paths = ["src/kidneymatch"]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/property"]
only_mutate = [
  "src/kidneymatch/hla/*",
  "src/kidneymatch/matching/*",
  "src/kidneymatch/ocr/*",
  "src/kidneymatch/ingestion/media.py",
]
do_not_mutate = ["src/kidneymatch/*/__init__.py"]
also_copy = ["config", "schemas", "tests/conftest.py"]
mutate_only_covered_lines = true
timeout_constant = 1.0
timeout_multiplier = 15.0
