name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run python scripts/sync_agent_skills.py --check
      - run: uv run python scripts/docs_lint.py
      - run: uv run python scripts/spec_lint.py
      - run: uv run python scripts/architecture_lint.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
